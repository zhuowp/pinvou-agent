[package]
name = "pinvou-manual-update"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11"
semver = "1"
tokio = { version = "1.49", features = ["time", "sync", "macros", "rt", "fs", "io-util"] }
uuid = { version = "1.11", features = ["v4"] }
